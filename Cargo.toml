[workspace]
resolver = "3"
members = ["crates/corral-proto", "crates/corral-sched", "crates/corral-worker", "crates/corral-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"
