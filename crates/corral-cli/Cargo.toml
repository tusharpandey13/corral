[package]
name = "corral-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4.6.9", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "json", "ansi"] }

corral-proto = { path = "../corral-proto" }
corral-sched = { path = "../corral-sched" }
corral-worker = { path = "../corral-worker" }
async-nats = "0.46.0"
futures = "0.3.34"
nkeys = "0.4.5"
serde_json = "1.0.154"
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net", "signal"] }
tracing = "0.1.44"
zstd = "0.14.4"

[[bin]]
name = "corral"
path = "src/main.rs"

[lints]
workspace = true
