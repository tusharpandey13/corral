[package]
name = "corral-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-nats = "0.46.0"
bytes = "1.12.2"
corral-proto = { version = "0.1.0", path = "../corral-proto" }
futures = "0.3.34"
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net", "process", "io-util", "signal"] }
tracing = "0.1.44"
ureq = { version = "3.5.2", default-features = false }
zstd = "0.14.4"

[lints]
workspace = true

[dev-dependencies]
corral-sched = { path = "../corral-sched" }
