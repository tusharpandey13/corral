[package]
name = "corral-guard"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
corral-proto = { version = "0.1.0", path = "../corral-proto" }
corral-worker = { version = "0.1.0", path = "../corral-worker" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net", "io-util", "signal"] }
tracing = "0.1.44"
rustix = { version = "1.1.6", features = ["fs", "process"] }
sha2 = "0.11.0"
regex = "1.13.2"

[lints]
workspace = true
