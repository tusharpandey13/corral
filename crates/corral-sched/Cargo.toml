[package]
name = "corral-sched"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-nats = "0.46.0"
axum = "0.8.9"
bytes = "1.12.2"
corral-proto = { version = "0.1.0", path = "../corral-proto" }
